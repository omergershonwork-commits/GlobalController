[platformio]
default_envs = m5stack-cardputer-adv

[env:m5stack-cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = post:scripts/no_stub_upload.py
lib_ldf_mode = deep+

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Excludes the example setup()/loop() shipped by the third-party
    ; Android TV library when it is consumed as a PlatformIO dependency.
    -DUNIT_TEST

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git#1.1.1
    AndroidTvRemote=https://github.com/nguyluky/ESP32_android_tv_remote_v2.git#3d58965bfdad03e4335f45d88eef0f0a52fd9917
    rweather/Crypto@0.4.0
    wolfssl/Arduino-wolfSSL@5.7.2
