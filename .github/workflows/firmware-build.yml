name: Firmware Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  platformio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Build Cardputer Adv firmware
        run: pio run -e m5stack-cardputer-adv
